name: Build Kyrgyz AI APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project ZIP
        shell: bash
        run: |
          set -e
          ZIP="$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)"
          test -n "$ZIP"
          rm -rf extracted
          mkdir extracted
          unzip -q "$ZIP" -d extracted
          if [ -f extracted/package.json ]; then
            cp -a extracted/. ./
          else
            DIR="$(find extracted -mindepth 1 -maxdepth 1 -type d | head -n 1)"
            test -n "$DIR"
            cp -a "$DIR"/. ./
          fi

      - name: Fix source syntax
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("src/main.tsx")
          s = p.read_text(encoding="utf-8")
          old = "});return()=>map.remove()},[mapOpen"
          new = "}));return()=>map.remove()},[mapOpen"
          if old not in s:
              raise SystemExit("Expected source pattern was not found.")
          p.write_text(s.replace(old, new, 1), encoding="utf-8")
          print("Source syntax fixed.")

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build web app
        run: npm run build

      - name: Add Android platform
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kyrgyz-AI-test-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
